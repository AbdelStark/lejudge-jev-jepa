# Vocabulary pusht@2 — 4x4 grid ablation of pusht@1. Only the grid differs.
version: pusht@2
grid: 4
grid_names:
  - [top-left, top-centre-left, top-centre-right, top-right]
  - [upper-left, upper-centre-left, upper-centre-right, upper-right]
  - [lower-left, lower-centre-left, lower-centre-right, lower-right]
  - [bottom-left, bottom-centre-left, bottom-centre-right, bottom-right]
wall_inset: 0.009765625
edge_margin: 0.02
block_scale: 0.05859375
angle_bins_deg:
  upright: [-30, 30]
  tilted right: [30, 90]
  on its side right: [90, 150]
  upside down: [150, 210]
  on its side left: [210, 270]
  tilted left: [270, 330]
# Calibrated on expert PushT data (block-centroid displacement per planning step of 5 env steps):
# p50 0.007, p90 0.046; moving-step tertiles 0.023 / 0.039. still < 2 px, slow < ~15 px, fast otherwise.
speed_thresholds:
  still: 0.004
  slow: 0.03
contact_logit_band: 0.5
